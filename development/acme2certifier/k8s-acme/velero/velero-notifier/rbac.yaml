# ServiceAccount + Role + RoleBinding para o CronJob de notificação Velero
# Permissão mínima: apenas leitura de backups e schedules
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: velero-notifier
  namespace: velero
  labels:
    app.kubernetes.io/name: velero-notifier
    app.kubernetes.io/component: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: velero-notifier
  namespace: velero
  labels:
    app.kubernetes.io/name: velero-notifier
    app.kubernetes.io/component: monitoring
rules:
  # Ler backups e schedules do Velero
  - apiGroups: ["velero.io"]
    resources: ["backups", "schedules"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: velero-notifier
  namespace: velero
  labels:
    app.kubernetes.io/name: velero-notifier
    app.kubernetes.io/component: monitoring
subjects:
  - kind: ServiceAccount
    name: velero-notifier
    namespace: velero
roleRef:
  kind: Role
  name: velero-notifier
  apiGroup: rbac.authorization.k8s.io
